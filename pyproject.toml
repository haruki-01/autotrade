[project]
name = "autotrade"
version = "0.1.0"
description = "Bybit BTC-USDT multi-timeframe trend bot research and execution"
readme = "readme"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.scripts]
autotrade = "autotrade.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
