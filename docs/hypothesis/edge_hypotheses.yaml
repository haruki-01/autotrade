schema_version: 2
# 検証すべき仮説リスト（機械可読）。正本の説明は EDGE_HYPOTHESES.md
# status:
#   proposed              未検証
#   mechanism_replicated  本命−対照のEV差が Set B / Set C で同符号（機構あり）
#   untestable            頻度不足で判定不能（仮説は保持）
#   rare_edge             両期間でEVプラスだが min_trades に構造的に届かない
#   fail                  棄却（対照が上回る or 期間依存 / n を増やしたら消えた）
#   adopted               デモ/本番に載せた
created: "2026-08-23"
last_eval: "2026-08-23"

