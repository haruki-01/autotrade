  note: >
    3期間（A/B/C）すべてゲートを通ったロジックは0本。判定は単体EVではなく
    「本命と対照のEV差の符号が全期間で保たれるか」で行った。
  known_issue:
    id: BUG-ENTRY-FEE
    fixed: "2026-08-23"
    desc: >
      run_backtest がエントリー手数料を equity からのみ引き、Trade.pnl は決済側の
      手数料しか引いていなかった。expectancy ゲートが読む値が1トレードあたり
      約 +0.05 USDT 過大だった。修正前の全評価（100サイクル・改良63本）の EV は
      この分を差し引いて読むこと。修正は成績を下げる方向なので不合格の結論は不変。
    guard: compute_metrics が sum(trade.pnl) と equity 増減の一致を検算する
  cost_floor:
    notional_usdt: 90.0
    round_trip_cost_usdt: 0.135
    pct_of_notional: 0.150
    pct_of_risk_budget: 4.5
    note: 測定したエッジ（0.05〜0.25 USDT/トレード）とコストが同じオーダー
  postmortem: docs/hypothesis/postmortems/2026-08-23-edge-100-cycles.md
  refine_postmortem: docs/hypothesis/postmortems/2026-08-23-edge-refine-cycles.md
  refine2_postmortem: docs/hypothesis/postmortems/2026-08-23-edge-06-09-and-fee-bug.md
  refine_result:
    eh01r: {set_b_pass: 3, set_c_holdout_pass: 0, note: 退出の改良では帯から出ない}
    eh07r: {set_b_pass: 0, both_period_positive: [eh07r_oi_rebuild_pre48], note: 希少で回数を増やすと消える}
    eh02r: {set_b_pass: 0, note: 頻度は解決したが全滅。ゲートを外したほうが良い}
    eh09r: {set_a_pass: 0, set_b_pass: 7, set_c_pass: 0, note: Set A で20本すべてマイナス・対照が優位。棄却}
    eh06r: {set_a_pass: 4, set_b_pass: 1, set_c_pass: 0, note: 回転を落とすと A/B は好転するが C が届かない}
    eh06n: {set_a_pass: 7, set_b_pass: 6, set_c_pass: 1, note: 近傍は傾斜。閾値もクールダウンも単調に効く}
  carry_forward:
    - 退出は構造退出のみ、またはATRトレール4以上（2.5は勝ちを切る）
    - 突破系でエントリーを遅らせない
    - 評価は3期間（A/B/C）。未使用の期間を必ず1つ残す
    - 組合せだけが効く設定は、採用前に近傍を地図にして傾斜か一点かを見る
    - シグナル探索より先にコスト構造（保有時間・元本）を決める
  reports:
    - eval/reports/20260823-edge-100-cycles-setB.md
    - eval/reports/20260823-edge-100-cycles-setC.md
    - eval/reports/20260823-edge-100-holdout-setC.md
    - eval/reports/20260823-edge-100-replication.md
    - eval/reports/20260823-edge-feefix-setA.md
